version: 2

models:
  - name: dim_empenho
    description: "Empenho no consolidado mensal; sk_empenho = h(nu_nota_empenho + cd_processo + ds_empenho). DISTINCT ON (sk_empenho) escolhe uma linha por chave (ORDER BY define qual)."
    columns:
      - name: sk_empenho
        data_tests:
          - not_null
          - unique

  - name: dim_unidade_administrativa
    columns:
      - name: sk_unidade_administrativa
        data_tests:
          - not_null
          - unique
      - name: nm_unidade_administrativa
        data_tests:
          - not_null

  - name: dim_fornecedor
    columns:
      - name: sk_fornecedor
        data_tests:
          - not_null
          - unique
      - name: cd_cpf_cnpj
        data_tests:
          - not_null

  - name: dim_funcional_pragmatica
    columns:
      - name: sk_funcional_pragmatica
        data_tests:
          - not_null
          - unique
      - name: cd_funcional_pragmatica
        data_tests:
          - not_null

  - name: dim_natureza_despeza
    columns:
      - name: sk_natureza_despesa
        data_tests:
          - not_null
          - unique
      - name: cd_natureza_despesa
        data_tests:
          - not_null

  - name: dim_fonte_recurso
    columns:
      - name: sk_fonte_recurso
        data_tests:
          - not_null
          - unique
      - name: cd_fonte_recurso
        data_tests:
          - not_null

  - name: fct_despesa
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_empenho
              - sk_unidade_administrativa
              - sk_fornecedor
              - sk_funcional_pragmatica
              - sk_natureza_despesa
              - sk_fonte_recurso
              - sk_tempo_empenho
              - sk_tempo_liquidacao
      - dbt_utils.expression_is_true:
          arguments:
            expression: "vl_empenhado_mes >= 0 and vl_liquidado_mes >= 0 and vl_pago_mes >= 0"
    columns:
      - name: sk_empenho
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empenho')
                field: sk_empenho
      - name: sk_unidade_administrativa
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_unidade_administrativa')
                field: sk_unidade_administrativa
      - name: sk_fornecedor
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fornecedor')
                field: sk_fornecedor
      - name: sk_funcional_pragmatica
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_funcional_pragmatica')
                field: sk_funcional_pragmatica
      - name: sk_natureza_despesa
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_natureza_despeza')
                field: sk_natureza_despesa
      - name: sk_fonte_recurso
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fonte_recurso')
                field: sk_fonte_recurso
      - name: sk_tempo_empenho
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo
      - name: sk_tempo_liquidacao
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo
      - name: vl_empenhado_mes
        data_tests:
          - not_null
      - name: vl_liquidado_mes
        data_tests:
          - not_null
      - name: vl_pago_mes
        data_tests:
          - not_null

  - name: fct_receita
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_natureza_receita
              - sk_tempo_referencia
      - dbt_utils.expression_is_true:
          arguments:
            expression: "vl_arrecadada_mes is not null and vl_previsto_mensal is not null"
    columns:
      - name: sk_natureza_receita
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_natureza_receita')
                field: sk_natureza_receita
      - name: sk_tempo_referencia
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo
      - name: vl_previsto_mensal
      - name: vl_arrecadada_mes

  - name: fct_receita_acumulada
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_natureza_receita
              - sk_tempo_referencia
      - dbt_utils.expression_is_true:
          arguments:
            expression: "vl_previsao_inicial_comparativa is not null and vl_previsao_atualizada is not null and vl_arrecadada_ano is not null and vl_a_realizar is not null"
    columns:
      - name: sk_natureza_receita
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_natureza_receita')
                field: sk_natureza_receita
      - name: sk_tempo_referencia
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo
      - name: vl_previsao_inicial_comparativa
        data_tests:
          - not_null
      - name: vl_previsao_atualizada
        data_tests:
          - not_null
      - name: vl_arrecadada_ano
        data_tests:
          - not_null
      - name: vl_a_realizar
        data_tests:
          - not_null